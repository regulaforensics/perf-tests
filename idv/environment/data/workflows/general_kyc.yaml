transformers:
  - id: GET_DOC_READER_RESULTS
    name: GET_DOC_READER_RESULTS
    type: easyjson
    extracts:
      - id: DOCTYPE
        rule:
          key: dType
          path: ContainerList.List.OneCandidate.FDSIDList
      - id: CHIP_PAGE
        rule:
          key: ChipPage
      - id: AGE
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 185
              lcid: 0
      - id: FULL_AUTH_OVERALL_STATUS
        rule:
          key: overallStatus
          path: ContainerList.List.Status
      - id: RFID_STATUS
        rule:
          key: Status
          path: ContainerList.List.TDocBinaryInfo.RFID_BINARY_DATA.RFID_Session_Data
      - id: MRZ_STATUS
        rule:
          key: mrz
          path: ContainerList.List.Status.detailsOptical
      - id: FULL_NAME
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 25
              lcid: 0
      - id: FIRST_NAME
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 9
              lcid: 0
      - id: SURNAME
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 8
              lcid: 0
      - id: DOCUMENT_NUMBER
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 2
              lcid: 0
      - id: DOC_PHOTO
        rule:
          key: value
          path: ContainerList.List.Images.fieldList.valueList
          filters:
            fieldList:
              fieldType: 201
            valueList:
              containerType: 6
      - id: DOC_PHOTO
        rule:
          key: value
          path: ContainerList.List.Images.fieldList.valueList
          filters:
            fieldList:
              fieldType: 201
            valueList:
              containerType: 103
      - id: NATIONALITY
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 11
              lcid: 0
      - id: DATE_OF_BIRTH
        rule:
          key: value
          path: ContainerList.List.Text.fieldList
          filters:
            fieldList:
              fieldType: 5
              lcid: 0
  - id: MATCH_DOC_AND_LIVENESS_TRANSFORMER
    name: MATCH_DOC_AND_LIVENESS_TRANSFORMER
    type: json
    extracts:
      - id: LIVENESS_DOC_SIMILARITY
        rule: $..results.[0].similarity
  - id: LIVENESS_STATUS_TRANSFORMER
    name: LIVENESS_STATUS_TRANSFORMER
    type: json
    extracts:
      - id: LIVENESS_STATUS
        rule: $..status
  - id: LIVENESS_PORTRAIT_TRANSFORMER
    name: LIVENESS_PORTRAIT_TRANSFORMER
    type: binary
    extracts:
      - id: LIVENESS_PORTRAIT
  - id: LIVENESS_VIDEO_TRANSFORMER
    name: LIVENESS_VIDEO_TRANSFORMER
    type: binary
    extracts:
      - id: LIVENESS_VIDEO
  - id: DOC_VIDEO_TRANSFORMER
    name: DOC_VIDEO_TRANSFORMER
    type: binary
    extracts:
      - id: DOC_VIDEO
  - id: LIVENESS_TRANSFORMER
    name: LIVENESS_TRANSFORMER
    type: json
    extracts:
      - id: LIVENESS_TRANSACTION_ID
        rule: $..transactionId
  - id: DOC_READER_TRANSFORMER
    name: DOC_READER_TRANSFORMER
    type: json
    extracts:
      - id: TRANSACTION_ID
        rule: $..transactionId
      - id: HAS_NFC
        rule: $..has_nfc
  - id: SCAN_RFID_TRANSFORMER
    name: SCAN_RFID_TRANSFORMER
    type: json
    extracts:
      - id: SCAN_RFID_TRANSACTION_ID
        rule: $..transactionId
  - id: CANCEL_TRANSFORMER
    name: CANCEL_TRANSFORMER
    type: json
    extracts:
      - id: CANCEL
        rule: $..cancel
  - id: CONTINUE_TRANSFORMER
    name: CONTINUE_TRANSFORMER
    type: json
    extracts:
      - id: CONTINUE
        rule: $..continue
  - id: CONTINUE_OR_SKIP_TRANSFORMER
    name: CONTINUE_OR_SKIP_TRANSFORMER
    type: json
    extracts:
      - id: CONTINUE
        rule: $..continue
      - id: SKIP
        rule: $..skip
actions:
  - id: MATCH_DOC_AND_LIVENESS
    name: MATCH_DOC_AND_LIVENESS
    type: http
    fileId: match_doc_and_liveness
    transformers:
      - id: MATCH_DOC_AND_LIVENESS_TRANSFORMER
    options:
      url: '{{ config.services.faceapi.url }}/api/match?logRequest=false'
      method: post
      headers: null
      successCodes:
        - 200
      body: |
        {
          "images": [
            {
              "index": 0,
              "data": "{{ DOC_PHOTO | loadFromStorage | b64encode }}",
              "type": 1
            },
            {
              "index": 1,
              "data": "{{ LIVENESS_PORTRAIT | loadFromStorage | b64encode }}",
              "type": 3
            }
          ]
        }
      response: {}
      timeout: 25
    when:
      type: statement
      op: $and
      groups:
        - op: $and
          conditions:
            - property: LIVENESS_PORTRAIT
              op: $exists
  - id: DOCREADER_SCENARIO
    name: DOCREADER_SCENARIO
    type: http
    options:
      url: >-
        {{ config.services.docreader.url }}/api/v2/transaction/{{ TRANSACTION_ID
        }}/process?useCache=true
      method: post
      headers: null
      successCodes:
        - 200
      body: |
        {
          "processParam": {
              "scenario": "FullProcess",
              "useFaceApi": true,
              "faceApi": {
                  "serviceTimeout": 10000,
                  "url": "{{ config.services.faceapi.url }}"
              },
              "log": true,
              "authParams": {
                  "livenessParams": {
                      "checkED": false
                }
            }
          }
        }
      response: {}
    retry: {}
  - id: GET_DOCREADER_RESULTS
    name: GET_DOCREADER_RESULTS
    type: http
    fileId: doc_reader_results
    transformers:
      - id: GET_DOC_READER_RESULTS
    options:
      url: >-
        {{ config.services.docreader.url }}/api/v2/transaction/{{ TRANSACTION_ID
        }}/results?withImages=true
      method: get
      headers: null
      successCodes:
        - 200
      body: null
      response: {}
  - id: LIVENESS_STATUS
    name: LIVENESS_STATUS
    type: http
    fileId: liveness_status
    transformers:
      - id: LIVENESS_STATUS_TRANSFORMER
    options:
      url: >-
        {{ config.services.faceapi.url }}/api/v2/liveness?transactionId={{
        LIVENESS_TRANSACTION_ID }}&logRequest=false
      method: get
      headers: null
      successCodes:
        - 200
      body: null
      response: {}
      timeout: 20
  - id: GET_LIVENESS_PORTRAIT
    name: LIVENESS_PORTRAIT
    type: http
    transformers:
      - id: LIVENESS_PORTRAIT_TRANSFORMER
    options:
      url: >-
        {{ config.services.faceapi.url
        }}/api/v2/liveness/portrait?transactionId={{ LIVENESS_TRANSACTION_ID
        }}&logRequest=false
      method: get
      headers: null
      successCodes:
        - 200
        - 404
      body: null
      response: {}
      timeout: 20
  - id: GET_LIVENESS_VIDEO
    name: LIVENESS_VIDEO
    type: http
    transformers:
      - id: LIVENESS_VIDEO_TRANSFORMER
    options:
      url: >-
        {{ config.services.faceapi.url }}/api/v2/liveness/video?transactionId={{
        LIVENESS_TRANSACTION_ID }}&logRequest=false
      method: get
      headers: null
      successCodes:
        - 200
        - 404
      body: null
      response: {}
      timeout: 20
  - id: GET_DOC_VIDEO
    name: GET_DOC_VIDEO
    type: http
    transformers:
      - id: DOC_VIDEO_TRANSFORMER
    options:
      url: >-
        {{ config.services.docreader.url }}/api/v2/transaction/{{ TRANSACTION_ID
        }}/file?name=in/video.mp4&logRequest=false
      method: get
      headers: null
      successCodes:
        - 200
        - 404
      body: null
      response: {}
      timeout: 20
