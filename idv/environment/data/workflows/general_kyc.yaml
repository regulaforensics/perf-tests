view:
  title:
    propertyIds:
      - FULL_NAME
  photo:
    propertyIds:
      - DOC_PHOTO
  fields:
    - propertyId: DATE_OF_BIRTH
      name: Date of Birth
    - propertyId: NATIONALITY
      name: Nationality
    - propertyId: DOCUMENT_NUMBER
      name: Document number
normalizers:
  - id: document
    name: Document status
    type: DOCUMENT
    rules:
      - id: valid_document
        decision: true
      - id: valid_document_type
        decision: true
      - id: valid_age
        decision: true
    identifier:
      property: TRANSACTION_ID
    group: Documents
    options:
      documentFile:
        actionId: GET_DOCREADER_RESULTS
      videoFile:
        property: DOC_VIDEO
  - id: liveness
    name: Liveness
    type: LIVENESS
    rules:
      - id: compliant_liveness_status
        decision: true
    group: Biometrics
    options:
      livenessPortrait:
        property: LIVENESS_PORTRAIT
      livenessVideo:
        property: LIVENESS_VIDEO
  - id: face_match
    name: Selfie match
    type: FACE_MATCH
    rules:
      - id: valid_similarity
        decision: true
    group: Biometrics
    options:
      results:
        - name: Selfie
          similarity: null
          file:
            actionId: GET_LIVENESS_PORTRAIT
        - name: Passport
          similarity:
            property: LIVENESS_DOC_SIMILARITY
          file:
            property: DOC_PHOTO