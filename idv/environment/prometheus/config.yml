global:
  scrape_interval: 10s
  external_labels:
    monitor: "idv-coordinator"

rule_files:

scrape_configs:
  - job_name: "idv-api"
    static_configs:
      - targets: ["webserver:8000"]

  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  - job_name: "mongodb"
    static_configs:
      - targets: [ "mongo:27017" ]

  - job_name: "opensearch"
    static_configs:
      - targets: [ "opensearch:9200" ]

  - job_name: "locust-monitoring"
    static_configs:
      - targets: [ "locust-metrics-exporter:9646" ]

